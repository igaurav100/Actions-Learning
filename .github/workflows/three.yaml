# Advance Matrix
name: Test Matrix Pipeline
on: [push, pull_request, workflow_dispatch]
jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                node: [18, 20, 22, 24]
                architecture: [x64, arm64]

                # Include additional combinations if needed
                include:
                    - os: ubuntu-latest
                      node: 20
                      architecture: x64
                      experiment: true
                exclude:
                    - os: windows-latest
                      node: 14
                      architecture: x86
                    - os: macos-latest
                      node: 14
                      architecture: x86
        continue-on-error: ${{ matrix.experiment || false }}

        steps:
            - uses: actions/checkout@v3
            - name: Set up Node.js ${{ matrix.node }}
              uses: actions/setup-node@v3
              with:
                node-version: ${{ matrix.node }}
                cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test